name: Publish TypeScript package to npm

on:
  push:
    branches:
      - main
    paths:
      - 'ts/**'
      - '.github/workflows/publish-ts.yaml'
  workflow_dispatch:
    inputs:
      bump-type:
        description: "Version bump type"
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  # ── Detect release ───────────────────────────────────────────────────────
  # Runs on every push to main that touches ts. Compares the version in
  # ts/package.json with the version npm serves under the latest tag, or 0.0.0
  # before the first release. A release is due only when the file carries a
  # strictly newer semver, which is what merging a release pull request
  # produces; every other push publishes nothing.
  detect:
    name: Detect release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-release: ${{ steps.compare.outputs.should-release }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Compare with npm latest
        id: compare
        env:
          PACKAGE_NAME: "@miloapis/instrumentation"
        run: |
          FILE_VERSION=$(node -p "require('./ts/package.json').version")
          NPM_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo 0.0.0)
          SHOULD_RELEASE=$(node - "$FILE_VERSION" "$NPM_VERSION" <<'EOF'
          const parse = (raw) => {
            const m = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(raw);
            if (!m) throw new Error(`not a semver version: ${raw}`);
            return { core: m.slice(1, 4).map(Number), pre: m[4] };
          };
          const [file, npm] = process.argv.slice(2).map(parse);
          let cmp = 0;
          for (let i = 0; i < 3 && cmp === 0; i++) cmp = file.core[i] - npm.core[i];
          // Same core version: a final release outranks a pre-release, and a
          // pre-release never outranks anything with the same core.
          if (cmp === 0 && !file.pre && npm.pre) cmp = 1;
          process.stdout.write(cmp > 0 ? "true" : "false");
          EOF
          )
          echo "ts/package.json is ${FILE_VERSION}, npm latest is ${NPM_VERSION}, release: ${SHOULD_RELEASE}"
          echo "version=${FILE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "should-release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

  # ── Publish release to npm ───────────────────────────────────────────────
  # Runs when a push to main carries a newer version than npm's latest tag.
  # Publishes the version already present in ts/package.json to latest.
  publish-release:
    name: Publish release
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    permissions:
      contents: read
      id-token: write
    uses: datum-cloud/actions/.github/workflows/publish-npm-package.yaml@v1.14.0
    with:
      package-name: "@miloapis/instrumentation"
      package-path: ts
      release-mode: release
    secrets: inherit

  # ── Tag and create GitHub Release ────────────────────────────────────────
  # Runs after publish-release. Tags the pushed commit as ts/v<version> and
  # creates the matching GitHub release. The ts/ prefix keeps the package out of
  # the go/v* tag namespace used by the Go module.
  tag-and-release:
    name: Tag and create GitHub Release
    needs: [detect, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      TAG: ts/v${{ needs.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Create and push tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} already exists; refusing to move it"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "@miloapis/instrumentation v${VERSION}" "${{ github.sha }}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "@miloapis/instrumentation v${VERSION}" \
            --generate-notes

  # ── Open release pull request ────────────────────────────────────────────
  # Runs only on manual dispatch. Bumps ts/package.json on a release branch
  # and opens a pull request against main. main only accepts pull requests,
  # so nothing is pushed to main here; merging the pull request is what
  # publishes the release.
  open-release-pr:
    name: Open release pull request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump version
        id: bump
        working-directory: ts
        env:
          BUMP_TYPE: ${{ inputs.bump-type }}
        run: |
          npm version "$BUMP_TYPE" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=chore/release-ts-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add ts/package.json
          git commit -m "chore(ts): release @miloapis/instrumentation v${VERSION}"
          git push origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          BUMP_TYPE: ${{ inputs.bump-type }}
        run: |
          BODY="Bumps \`ts/package.json\` to **${VERSION}** (${BUMP_TYPE} bump).

          Merging this pull request publishes \`@miloapis/instrumentation\` v${VERSION} to npm's \`latest\` tag and creates the tag \`ts/v${VERSION}\` with a GitHub release."
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "chore(ts): release @miloapis/instrumentation v${VERSION}" \
            --body "$BODY"
