version: '3'

vars:
  GO_FLOOR: 1.25.0
  GO_LATEST: 1.27.2
  GOLANGCI_LINT_VERSION: v2.12.2
  ACTIONLINT_VERSION: v1.7.7
  CONTROLLER_RUNTIME_NEWEST: v0.25.1
  TOOL_DIR: '{{.ROOT_DIR}}/bin'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  ci:
    desc: Run exactly what GitHub CI runs
    cmds:
      - task: check-floor
      - task: check-generated
      - task: tidy
      - task: vet
      - task: lint
      - task: lint-workflows
      - task: test
      - task: test-newest-deps

  generate:
    desc: Regenerate code from labels.yaml
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
    cmds:
      - go generate ./...

  check-generated:
    desc: Fail if generated code differs from what labels.yaml produces
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
    cmds:
      - |
        tmp="$(mktemp)"
        trap 'rm -f "$tmp"' EXIT
        go run ./internal/labelgen -in labels.yaml -out "$tmp" -package labels
        if ! cmp -s "$tmp" labels/zz_generated.go; then
          echo "labels/zz_generated.go is stale; run task generate" >&2
          diff -u labels/zz_generated.go "$tmp" >&2 || true
          exit 1
        fi

  lint-workflows:
    desc: Lint GitHub workflows with the pinned actionlint
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}

  check-floor:
    desc: Fail if go.mod's go directive differs from GO_FLOOR
    cmds:
      - |
        actual="$(go mod edit -print | awk '/^go /{print $2}')"
        if [ "$actual" != "{{.GO_FLOOR}}" ]; then
          echo "go.mod declares go $actual but GO_FLOOR is {{.GO_FLOOR}}" >&2
          exit 1
        fi

  tidy:
    desc: Fail if go.mod or go.sum is not tidy
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
    cmds:
      - go mod tidy -diff

  vet:
    desc: Run go vet on the floor toolchain
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
    cmds:
      - go vet ./...

  lint:
    desc: Run the pinned golangci-lint on the floor toolchain
    deps: [install-golangci-lint]
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
    cmds:
      - '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}} run ./...'

  install-golangci-lint:
    internal: true
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
      GOBIN: '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}.d'
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - mv '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}.d/golangci-lint' '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}'
      - rmdir '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}.d'
    status:
      - test -x '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}'

  test:
    desc: Run tests on the floor and latest toolchains
    cmds:
      - task: test-on
        vars: {GO_VERSION: '{{.GO_FLOOR}}'}
      - task: test-on
        vars: {GO_VERSION: '{{.GO_LATEST}}'}

  test-newest-deps:
    desc: Run tests against the newest controller-runtime, in a copy of the module
    env:
      GOTOOLCHAIN: go{{.GO_LATEST}}
    cmds:
      - |
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        rsync -a --exclude .git --exclude .claude --exclude bin ./ "$tmp/"
        cd "$tmp"
        go get sigs.k8s.io/controller-runtime@{{.CONTROLLER_RUNTIME_NEWEST}}
        go mod tidy
        go test -race ./...

  test-on:
    internal: true
    env:
      GOTOOLCHAIN: go{{.GO_VERSION}}
    cmds:
      - go version
      - go test -race ./...
