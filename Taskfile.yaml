version: '3'

vars:
  GO_FLOOR: 1.25.0
  GO_LATEST: 1.27.2
  GOLANGCI_LINT_VERSION: v2.12.2
  ACTIONLINT_VERSION: v1.7.7
  TOOL_DIR: '{{.ROOT_DIR}}/bin'

tasks:
  ci:
    desc: Run exactly what GitHub CI runs
    cmds:
      - task: check-floor
      - task: tidy
      - task: vet
      - task: lint
      - task: lint-workflows
      - task: test

  lint-workflows:
    desc: Lint GitHub workflows with the pinned actionlint
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}

  check-floor:
    desc: Fail if go.mod's go directive differs from GO_FLOOR
    cmds:
      - |
        actual="$(go mod edit -print | awk '/^go /{print $2}')"
        if [ "$actual" != "{{.GO_FLOOR}}" ]; then
          echo "go.mod declares go $actual but GO_FLOOR is {{.GO_FLOOR}}" >&2
          exit 1
        fi

  tidy:
    desc: Fail if go.mod or go.sum is not tidy
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
    cmds:
      - go mod tidy -diff

  vet:
    desc: Run go vet on the floor toolchain
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
    cmds:
      - go vet ./...

  lint:
    desc: Run the pinned golangci-lint on the floor toolchain
    deps: [install-golangci-lint]
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
    cmds:
      - '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}} run ./...'

  install-golangci-lint:
    internal: true
    env:
      GOTOOLCHAIN: go{{.GO_FLOOR}}
      GOBIN: '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}.d'
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - mv '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}.d/golangci-lint' '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}'
      - rmdir '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}.d'
    status:
      - test -x '{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}'

  test:
    desc: Run tests on the floor and latest toolchains
    cmds:
      - task: test-on
        vars: {GO_VERSION: '{{.GO_FLOOR}}'}
      - task: test-on
        vars: {GO_VERSION: '{{.GO_LATEST}}'}

  test-on:
    internal: true
    env:
      GOTOOLCHAIN: go{{.GO_VERSION}}
    cmds:
      - go version
      - go test -race ./...
