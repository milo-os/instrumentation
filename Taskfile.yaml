version: '3'

vars:
  # renovate: datasource=go depName=github.com/rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.7

includes:
  go:
    taskfile: go/Taskfile.yaml
    dir: go
  ts:
    taskfile: ts/Taskfile.yaml
    dir: ts

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  ci:
    desc: Run exactly what GitHub CI runs
    cmds:
      - task: lint-workflows
      - task: go:ci
      - task: ts:ci

  generate:
    desc: Regenerate every language's code from labels.yaml
    cmds:
      - task: go:generate
      - task: ts:generate

  lint-workflows:
    desc: Lint GitHub workflows with the pinned actionlint
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
